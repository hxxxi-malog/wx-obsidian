name: Release

# CD：只在打 tag 时发布，主干推送不推镜像（避免把 registry 当 CI 缓存用）。
# 发布产物是容器镜像（本项目主用运行方式就是 `docker compose up`），
# 顺带建一个 GitHub Release 记录这次发了什么。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.0.0），必须已存在"
        required: true
        type: string

# 发布不能被打断：推到一半取消会留下半套 tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # steps 不跨 job：下面 github-release 要用的预发布判定必须从 job outputs 出去，
    # 直接写 ${{ steps.ref.outputs.* }} 在那个 job 里会静默取到空串（actionlint 会报）。
    outputs:
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      # 手动触发时 github.ref 是分支名，必须显式 checkout 目标 tag，
      # 否则会拿主干代码去发一个「v0.1.0」的镜像。
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 多架构发布：GHA 的 runner 是 amd64，buildx 默认只出本机架构，而用户机器
      # （Apple Silicon）与 ARM 主机必须要有 arm64 才能 pull —— 实测缺 arm64 时
      # `docker pull` 直接报 no matching manifest for linux/arm64/v8。
      # QEMU 必须先于 buildx：buildx 靠它注册 binfmt 才能跨架构构建。
      # 代价：arm64 那一半是模拟执行的，前端（pnpm + vite）会明显变慢。
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发（workflow_dispatch）时 github.ref 是分支名 refs/heads/main，
      # metadata-action 的 type=semver 解析不出 tag 会直接跳过（日志里表现为
      # `value=,match=`），结果只推 latest + sha、版本标签原地不动。
      # 所以显式把「这次要发布的 tag」解析出来，两条路径共用同一套标签推导。
      #
      # 顺带判预发布：semver 里带 `-`（如 v1.2.0-rc1）就是预发布。
      # 预发布绝不能顶掉 latest / 1.2 这类**滚动标签**，否则 `docker pull ...:latest`
      # 会静默拿到 rc 版；精确标签（1.2.0-rc1）与 sha 照推，rc 依然可被指名拉取。
      - id: ref
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "本次发布：tag=$tag，预发布=$prerelease"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 两条滚动标签都挂了 enable：预发布（tag 带 `-`）时只推精确版本 + sha，
          # 不动 latest、也不动 1.2（见上面 id: ref 的说明）。
          # enable 收的是布尔字面量，GitHub Actions 会先把 ${{ }} 求值成 true/false。
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.ref.outputs.prerelease == 'false' }}
            type=sha
            type=raw,value=latest,enable=${{ steps.ref.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/wx-obsidian/Dockerfile
          # 一次构建出两种架构的 manifest list。不能写 load: true ——
          # 多架构镜像无法装进本地 docker，只能 push。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: 建 GitHub Release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 幂等：重复跑（或 tag 已手工建过 Release）时不报错
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
          elif [ "$PRERELEASE" = "true" ]; then
            # 必须显式标 --prerelease：不标的话 GitHub 会把它当成「Latest release」，
            # 与 latest 镜像标签是同一类坑（用户看到 rc 被标成正式版）。
            gh release create "$TAG" --generate-notes --title "$TAG" --prerelease
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
