name: Security

# 安全面单独一个 workflow：它与「代码能不能跑」无关，
# 失败原因也不同（泄漏、漏洞通告），混在 CI 里容易让人误判。
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    # 每周一 06:00（Asia/Shanghai）：漏洞通告与历史泄漏不会因为没人提交就消失
    - cron: "0 22 * * 0"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------- .env / 密钥守卫
  secret-guard:
    name: 密钥守卫（.env / 内容 / .gitignore）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # 历史扫描需要完整历史（默认 fetch-depth: 1 只有最后一次提交）
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 纯标准库，不需要装任何依赖
      - name: .github/scripts/check_secrets.py --history
        run: python .github/scripts/check_secrets.py --history

  # -------------------------------------------------------------- gitleaks（第二意见）
  gitleaks:
    name: gitleaks 全历史扫描
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 用官方镜像而不是 gitleaks-action：action 在组织仓库里需要
      # GITLEAKS_LICENSE，镜像没有这个限制，版本与行为也都看得见。
      # 白名单（.env.example / tests 假值）在 .github/gitleaks.toml。
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.github/gitleaks.toml \
            --redact --verbose

  # -------------------------------------------------------------- 依赖漏洞（只报不拦）
  dependency-audit:
    name: 依赖漏洞审计（py${{ matrix.python-version }}，只报不拦）
    runs-on: ubuntu-24.04
    # 只审一档，而且这一档就是容器真正跑的那套：底线抬到 3.12 后，uv.lock 不再按
    # Python marker 分叉（历史上 3.9 + 3.12 会分叉出 starlette 0.49/1.8、
    # urllib3 2.6.3/2.8.0），所以单档即全量，不存在「审了个不发货的版本」。
    #
    # 不拦合并，但不再靠 continue-on-error 蒙混：结果写进 job summary + warning
    # 注解，job 自己保持绿色，只有 pip-audit 执行失败才红。这样红叉恒等于
    # 「真出事了」，而不是「上游又发通告了」。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      # 不装 dev extra：要审的是运行期依赖，也就是容器里真正会跑的那些
      - name: 按 uv.lock 装出运行环境
        run: uv sync --frozen --no-install-project --python ${{ matrix.python-version }}

      # pip-audit 用 `uv tool run` 跑在隔离环境里，不装进被审环境：装进去的话
      # 它会把自己的依赖（pip / msgpack / filelock …）也审一遍，报出一堆与项目
      # 无关的通告。--path 指向被审环境的 site-packages，审的才是真正会跑的包。
      - name: pip-audit
        run: |
          SITE=".venv/lib/python${{ matrix.python-version }}/site-packages"
          echo "审计目标：$SITE"
          set +e
          uv tool run pip-audit --path "$SITE" --progress-spinner off --format json -o audit.json
          code=$?
          set -e

          python3 - "${{ matrix.python-version }}" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import sys

          ver = sys.argv[1]
          path = pathlib.Path("audit.json")
          print(f"## 依赖漏洞审计（Python {ver}）\n")
          if not path.exists():
              print("pip-audit 没有产出报告，见本步骤日志。")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          # 按 (包, 版本, 通告 ID) 去重：pip-audit 会把同一条通告按不同来源
          # 列两次（ID 与 aliases 完全一样），不去重表格里会出现重复行。
          seen = {
              (d["name"], d["version"], v["id"]): v
              for d in data.get("dependencies", [])
              for v in d.get("vulns", [])
          }
          if not seen:
              print("未发现已知漏洞。")
              raise SystemExit(0)
          pkgs = sorted({k[0] for k in seen})
          print(f"发现 **{len(seen)}** 条通告，涉及 **{len(pkgs)}** 个包：{', '.join(pkgs)}\n")
          print("| 包 | 版本 | 通告 | 修复版本 |")
          print("|---|---|---|---|")
          for (name, pkg_ver, vuln_id), vuln in sorted(seen.items()):
              fix = ", ".join(vuln.get("fix_versions") or []) or "—"
              print(f"| {name} | {pkg_ver} | {vuln_id} | {fix} |")
          PY

          if [ "$code" = "0" ]; then
            echo "::notice::pip-audit：Python ${{ matrix.python-version }} 档未发现已知漏洞"
          elif [ "$code" = "1" ]; then
            echo "::warning title=依赖漏洞（Python ${{ matrix.python-version }}）::发现通告，详见 job summary（不拦合并）"
          else
            echo "::error::pip-audit 执行失败（退出码 $code）"
            exit "$code"
          fi
