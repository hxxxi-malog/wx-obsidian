# 依赖更新机器人：让上面几个 workflow 里钉住的版本自己跟上游走。
#
# 三个生态各自独立：
#   github-actions —— workflow 里 pin 的 action 大版本（升了就自动开 PR）
#   pip            —— pyproject.toml 的依赖（含 dev extra）
#   npm            —— 前端依赖（目录必须指到 package.json 所在处）
#
# 不想要这些 PR 的话，删掉本文件即可，不影响 CI 运行。

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 这里曾经有一条 `mypy >= 2` 的 ignore（mypy 2.x 移除 3.9 目标，会让
    # `[tool.mypy] python_version = "3.9"` 形同虚设）。底线抬到 3.12 后理由消失，
    # 已删除；mypy 2.4.0 实测在本仓库 37 个源文件上全绿。
    groups:
      # 一次 PR 打包所有小版本更新，避免每周收到十几个 PR
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/wx_obsidian/web/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 起 typescript 包只导出 ./unstable/*，不再有 ./lib/tsc 子路径，
      # 而 vue-tsc（含最新的 3.3.13）内部就是 require.resolve('typescript/lib/tsc')。
      # 升上去必炸 ERR_PACKAGE_PATH_NOT_EXPORTED，且这不是我们能修的：
      # 上游没发支持 TS 7 的 vue-tsc 之前，typescript 锁在 6.x。
      # 证据与复现步骤见 .github/CI.md 的「六、前端两个上游坑」。
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
