<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Referer 策略：token 会出现在地址栏，禁止外泄给任何第三方 -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <title>wx-obsidian</title>
    <!--
      主题必须在首次绘制前定下来，否则暗色用户会看到一帧白屏（FOUC）。
      取值优先级：localStorage > 系统偏好。key 与 src/composables/useTheme.ts 一致。
    -->
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('wx-obsidian-theme')
          const dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          /* 隐私模式下 localStorage 不可用，交给默认亮色 */
        }
      })()
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318171a'/%3E%3Cpath d='M9 21V11l7 6 7-6v10' stroke='%23c98a3f' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
